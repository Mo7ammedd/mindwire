# Self-hosted Mindwire: one private console and one daemon on an internal network.
#
# cp docker/.env.example docker/.env
# docker compose --env-file docker/.env -f docker/docker-compose.selfhost.yml up -d
#
# Both images are published from the same MindWire release. This file intentionally has image references
# only (no build contexts): pin MINDWIRE_VERSION in .env for deterministic upgrades. Use the root
# docker-compose.yml when deploying this repository's source.
services:
  runtime:
    image: ghcr.io/oblien/mindwire-runtime:${MINDWIRE_VERSION:?set MINDWIRE_VERSION in .env}
    restart: unless-stopped
    environment:
      ADDR: 0.0.0.0:8790
      AGENT_TYPE: ${MINDWIRE_AGENT:-claude-code}
      DAEMON_TOKEN: ${MINDWIRE_RUNTIME_TOKEN:?set a private runtime token}
      AGENT_CWD: /home/node
    volumes:
      - daemon_home:/home/node
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/healthz',{headers:{Authorization:'Bearer '+process.env.DAEMON_TOKEN},signal:AbortSignal.timeout(5000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 20s
      retries: 3

  console:
    image: ghcr.io/oblien/mindwire-console:${MINDWIRE_VERSION:?set MINDWIRE_VERSION in .env}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      # SQLite remains the default. Set DATABASE_URL, or all POSTGRES_* values including POSTGRES_HOST,
      # to deliberately use an external Postgres database for this self-hosted console.
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-mindwire}
      POSTGRES_USER: ${POSTGRES_USER:-mindwire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      AUTH_DB_PATH: /data/auth.db
      CONSOLE_MODE: self-hosted
      AUTH_SECRET: ${AUTH_SECRET:?set a private authentication secret}
      CONSOLE_USERNAME: ${CONSOLE_USERNAME:?set the console administrator}
      CONSOLE_PASSWORD: ${CONSOLE_PASSWORD:?set the console password}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set a separate encryption key}
      ALLOW_LOCAL_RUNTIME: "true"
      ALLOW_SSH_RUNTIME: "true"
      ALLOW_DOCKER_RUNTIME: "true"
      ALLOW_REMOTE_RUNTIME: "true"
      DAEMON_URL: http://runtime:8790
      MINDWIRE_RUNTIME_TOKEN: ${MINDWIRE_RUNTIME_TOKEN:?set a private runtime token}
      SEED_DEFAULT_DAEMON: "true"
    ports:
      - "${MINDWIRE_BIND_ADDR:-127.0.0.1}:${CONSOLE_PORT:-8787}:8787"
    volumes:
      - console_data:/data
    depends_on:
      runtime:
        condition: service_healthy

volumes:
  console_data:
  daemon_home:
