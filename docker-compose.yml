# Mindwire SaaS: source-built account portal and website, backed by PostgreSQL.
# No agent runtime or Docker socket runs in this stack.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mindwire}
      POSTGRES_USER: ${POSTGRES_USER:-mindwire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the database password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindwire -d mindwire"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_CONSOLE_URL: ${NEXT_PUBLIC_CONSOLE_URL:-https://console.mindwire.sh}
        NEXT_PUBLIC_IOS_APP_URL: ${NEXT_PUBLIC_IOS_APP_URL:-}
        NEXT_PUBLIC_MAC_APP_URL: ${NEXT_PUBLIC_MAC_APP_URL:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4327"
    ports:
      - "${MINDWIRE_BIND_ADDR:-127.0.0.1}:${WEB_PORT:-4327}:4327"

  console:
    build:
      context: .
      dockerfile: docker/console.Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: "8787"
      # An explicit DATABASE_URL is supported for managed Postgres. Otherwise the console builds a safe
      # connection URL from these standard Postgres settings (including correctly escaped passwords).
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-mindwire}
      POSTGRES_USER: ${POSTGRES_USER:-mindwire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set the database password}
      AUTH_SECRET: ${AUTH_SECRET:?set a random auth signing secret}
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:?set a separate encryption key}
      # Better Auth's canonical public origin. Override BASE_URL for a custom SaaS domain; it is also
      # the OAuth callback origin and is automatically included in the trusted-origin allowlist.
      BASE_URL: ${BASE_URL:-https://console.mindwire.sh}
    ports:
      - "${MINDWIRE_BIND_ADDR:-127.0.0.1}:${CONSOLE_PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  postgres_data:
