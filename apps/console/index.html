<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <!-- Set the theme class before first paint so there's no flash. Dark is the default (the console's
         signature look); the toggle in the nav persists the choice to localStorage under "mw-theme". -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("mw-theme");
          if (t !== "light" && t !== "dark") t = "dark";
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>Mindwire account</title>
    <meta
      name="description"
      content="Manage your Mindwire account, connected devices, Cloud Computers and subscriptions."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
