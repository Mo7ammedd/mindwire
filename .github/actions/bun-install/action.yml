name: Install Bun dependencies
description: Install and verify the locked Bun graph, retrying transient extraction or workspace-link failures.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        for attempt in 1 2 3; do
          install_options=(--frozen-lockfile)
          if [ "$attempt" -gt 1 ]; then
            # Isolated installs can otherwise reuse an incomplete store entry.
            install_options+=(--force)
          fi
          if bun install "${install_options[@]}" && node -e '
            const { createRequire } = require("node:module");
            const consoleRequire = createRequire(process.cwd() + "/apps/console/package.json");
            for (const name of ["better-sqlite3", "pg", "tsx"]) consoleRequire.resolve(name);
          '; then
            exit 0
          fi

          if [ "$attempt" -eq 3 ]; then
            echo "Bun dependency installation failed after ${attempt} attempts." >&2
            exit 1
          fi

          delay=$((attempt * 5))
          echo "Bun install failed; retrying in ${delay}s (${attempt}/3)…" >&2
          sleep "$delay"
        done
