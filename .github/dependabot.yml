version: 2
updates:
  # Go daemon
  - package-ecosystem: gomod
    directory: /packages/daemon
    schedule:
      interval: weekly
    labels: ["dependencies", "go"]

  # TypeScript SDK + workspace root
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "javascript"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

  # Production Docker base images and build runtimes
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
