version: 2
updates:
  # Go daemon
  - package-ecosystem: gomod
    directory: /packages/daemon
    schedule:
      interval: weekly
    labels: ["dependencies", "go"]

  # Bun workspaces and their shared lockfile
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "javascript"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

  # Production Docker base images and build runtimes
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
    # Node follows the selected LTS line; review major moves with .nvmrc and CI.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
